<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #2a2a40; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-top: 0; color: #6c5ce7; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: none; border-radius: 8px; background: #1e1e2f; color: white; outline: none; font-size: 1rem; }
        button { width: 100%; background: #00b894; border: none; padding: 12px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; margin-top: 10px;}
        button:hover { background: #00a082; }
        .error { color: #ff7675; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>أهلاً بك مجدداً 👋</h2>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %} <input type="text" name="username" placeholder="اسم المستخدم" required>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول للسيستم 🚀</button>
    </form>
</div>

</body>
</html>
