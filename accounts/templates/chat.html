<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; background: #2a2a40; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 80vh; overflow: hidden; }
        .chat-header { background: #6c5ce7; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 0.95rem; }
        .user-message { background: #6c5ce7; align-self: flex-start; border-bottom-right-radius: 0; }
        .ai-message { background: #404059; align-self: flex-end; border-bottom-left-radius: 0; }
        .input-area { display: flex; padding: 15px; background: #252538; border-top: 1px solid #3a3a55; }
        .input-area input { flex: 1; padding: 12px; border: none; border-radius: 25px; background: #1e1e2f; color: white; outline: none; margin-left: 10px; font-size: 1rem; }
        .input-area button { background: #00b894; border: none; padding: 12px 20px; border-radius: 25px; color: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .input-area button:hover { background: #00a082; }
        .loading { font-size: 0.8rem; color: #a0a0a0; align-self: flex-end; display: none; margin-top: -10px;}
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 المساعد الذكي الخاص بك</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">أهلاً بك! أنا مساعدك الذكي، كيف يمكنني مساعدتك في دراستك اليوم؟</div>
    </div>
    <div class="loading" id="loadingIndicator">جاري التفكير... ⏳</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText) return;

        const chatMessages = document.getElementById('chatMessages');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // 1. عرض رسالة الطالب
        chatMessages.innerHTML += `<div class="message user-message">${messageText}</div>`;
        inputField.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // 2. إظهار علامة التحميل
        loadingIndicator.style.display = 'block';

        try {
            // 3. إرسال الطلب للـ API
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });
            
            const data = await response.json();
            
            // إخفاء علامة التحميل
            loadingIndicator.style.display = 'none';

            if (data.status === 'success') {
                // 4. السحر هنا: تأثير الكتابة الحية (Typing Effect) ✨
                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.className = 'message ai-message';
                chatMessages.appendChild(aiMessageDiv);
                
                let i = 0;
                const text = data.reply;
                
                // دالة بتكتب حرف كل 30 جزء من الثانية
                const typingInterval = setInterval(() => {
                    if (i < text.length) {
                        aiMessageDiv.innerHTML += text.charAt(i);
                        i++;
                        chatMessages.scrollTop = chatMessages.scrollHeight; // النزول لأسفل مع الكتابة
                    } else {
                        clearInterval(typingInterval); // نوقف لما يخلص
                    }
                }, 30); // تقدر تقلل الرقم ده لو عايزه يكتب أسرع

            } else {
                chatMessages.innerHTML += `<div class="message ai-message" style="color:#ff7675;">⚠️ حدث خطأ: ${data.error}</div>`;
            }
        } catch (error) {
            loadingIndicator.style.display = 'none';
            chatMessages.innerHTML += `<div class="message ai-message" style="color:#ff7675;">⚠️ خطأ في الاتصال بالخادم.</div>`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }    
</script>
</body>
</html>
